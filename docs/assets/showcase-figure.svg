  <text class="rs-fig-caption" x="26" y="470.0"><tspan class="em">Both duties are 12 CFR 1002.9(b)(2), on this same decision.</tspan> A checker that reads the notice&#8217;s form alone reports it compliant &#8212; and launders that gap into a document that reads as authoritative.</text>
