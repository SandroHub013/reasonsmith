  <rect class="rs-fig-bg" x="0" y="0" width="1203" height="506"/>
  <text class="rs-fig-title" x="26" y="46">One declined credit application, decision APP-1042</text>
  <text class="rs-fig-sub" x="26" y="70">The reasons the adverse-action notice gave the applicant, beside the reasons the decision&#8217;s own inference used. reasonsmith re-ran that inference and switched each</text>
  <text class="rs-fig-sub" x="26" y="88">reason off in turn: <tspan font-weight="700">4</tspan> of the 5 are reasons the system&#8217;s answer did not depend on. Nothing here was read from the decision log &#8212; the log records nothing missing.</text>

