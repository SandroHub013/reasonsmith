  <path class="rs-fig-panel-head" d="M26.0 123.0a7 7 0 0 1 7 -7h550.4a7 7 0 0 1 7 7v19.0h-564.4z"/>
  <text class="rs-fig-panel-title" x="42.0" y="133.5">WHAT THE APPLICANT WAS TOLD</text>
  <text class="rs-fig-panel-count" x="574.4" y="133.5" text-anchor="end">1 of 5 reasons</text>

