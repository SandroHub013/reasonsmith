  <text class="rs-fig-panel-title" x="628.4" y="133.5">WHAT THE DECISION ACTUALLY USED</text>
  <text class="rs-fig-panel-count" x="1160.8" y="133.5" text-anchor="end">5 reasons, 4 struck</text>

